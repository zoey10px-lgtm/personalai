org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ─────────────────────────────────────────────
# Pleos SDK(Vehicle 2.3.2 + NaviHelper 3.0.5)를 APK에 넣을지 정합니다.
#   true  : 넣는다 (기본값). Pleos 에뮬레이터에서 진짜 차 데이터를 읽습니다.
#   false : 뺀다. Pleos 저장소에 접속이 안 돼서 빌드가 실패할 때만 false로 바꾸세요.
#           이때도 앱은 "가짜 차" 모드로 정상 동작합니다.
# ─────────────────────────────────────────────
pleosSdk=true
