name: Build Car Persona APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'carpersona-project/carpersona/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carpersona-project/carpersona
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon -PpleosSdk=false
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-persona-debug-apk
          path: carpersona-project/carpersona/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
